<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tracker</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f7f8;
    --card-bg: #ffffff;
    --text: #1a1a1a;
    --muted: #666;
    --accent: #4f46e5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111114;
      --card-bg: #1c1c22;
      --text: #f2f2f2;
      --muted: #a0a0a8;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .card {
    background: var(--card-bg);
    border-radius: 16px;
    padding: 48px 40px;
    max-width: 420px;
    width: 90%;
    text-align: center;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
  }
  h1 {
    margin: 0 0 12px;
    font-size: 1.8rem;
  }
  p {
    margin: 0;
    color: var(--muted);
    line-height: 1.5;
  }
  .badge {
    display: inline-block;
    margin-top: 20px;
    padding: 6px 14px;
    border-radius: 999px;
    background: var(--accent);
    color: #fff;
    font-size: 0.85rem;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Tracker</h1>
    <p>A simple starter web page for the tracker project.</p>
    <span class="badge">It works!</span>
  </div>
</body>
</html>
